name: Report action

# Exercises .github/actions/report end to end against the golden fixtures, so a change to
# the extractor cannot quietly stop producing reports. Commenting is off here — this runs
# on the library's own PRs, which have no errors-ai.log of their own to talk about.
on:
  push:
    branches: [main]
    paths:
      - '.github/actions/report/**'
      - '.github/workflows/report-action.yml'
      - 'stacktale-core/src/test/resources/golden/**'
  pull_request:
    paths:
      - '.github/actions/report/**'
      - '.github/workflows/report-action.yml'
      - 'stacktale-core/src/test/resources/golden/**'
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build a log from the golden fixtures
        run: |
          set -euo pipefail
          g=stacktale-core/src/test/resources/golden
          {
            cat "$g/full-report.txt"; echo
            cat "$g/rich-report.txt"; echo
            cat "$g/no-throwable.txt"; echo
            # a half-written tail: the writer appends the block separately, so a read can
            # catch this. FORMAT.md says a parser must discard it.
            echo '━━━ ERROR #dead9999 ━━━ 2026-07-26 10:00:00.000 thread=main ━━━'
            echo 'RuntimeException: truncated, no END line'
          } > errors-ai.log

      - id: report
        uses: ./.github/actions/report
        with:
          max-reports: "2"
          comment: "false"
          upload-artifact: "false"

      - name: The three complete reports are counted, the truncated one is not
        run: |
          set -euo pipefail
          got='${{ steps.report.outputs.count }}'
          if [ "$got" != "3" ]; then
            echo "expected 3 complete reports, got '$got'"
            exit 1
          fi
          # GITHUB_STEP_SUMMARY is a fresh file per step, so assert against the summary the
          # action actually produced — RUNNER_TEMP is shared across the job.
          summary="$RUNNER_TEMP/stacktale-summary.md"
          grep -q 'Showing the first 2' "$summary"
          grep -q '3 error reports' "$summary"
          if grep -q 'dead9999' "$summary"; then
            echo "the truncated block leaked into the summary"
            exit 1
          fi
          echo "ok"

      - name: An absent log is not an error
        run: rm errors-ai.log
      - id: empty
        uses: ./.github/actions/report
        with:
          comment: "false"
          upload-artifact: "false"
      - run: |
          [ '${{ steps.empty.outputs.count }}' = '0' ] || { echo "expected 0"; exit 1; }
          echo "ok"

      - name: st-json/1 logs are summarized when jq is available
        run: |
          set -euo pipefail
          cp .github/actions/report/fixtures/sample-st-json.ndjson errors-ai.log
          count=$(bash .github/actions/report/summarize.sh errors-ai.log 1 /tmp/st-json-summary.md)
          if [ "$count" != "2" ]; then
            echo "expected 2 st-json reports, got '$count'"
            exit 1
          fi
          grep -q '2 error reports' /tmp/st-json-summary.md
          grep -q 'IllegalStateException: payment gateway refused' /tmp/st-json-summary.md
          grep -q 'ERROR (no exception): checkout timed out' /tmp/st-json-summary.md
          grep -q 'json0001' /tmp/st-json-summary.md
          if grep -q '"type": "repeat"' /tmp/st-json-summary.md; then
            echo "repeat entries should not appear as reports in the summary"
            exit 1
          fi
          echo "ok"
