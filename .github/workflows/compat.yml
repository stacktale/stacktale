name: Compatibility matrix
on:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC
  workflow_dispatch:
  push:
    paths:
      - "**/pom.xml"
      - ".github/workflows/compat.yml"

jobs:
  backends:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # the plain-Logback floor excludes the Spring starter: Boot 3.4+ mandates
          # Logback 1.5, so "starter + Logback 1.4" is not a real combination
          - name: "Logback 1.4 (core, floor)"
            args: "-pl stacktale-core,stacktale,stacktale-log4j2 -am -Dlogback.version=1.4.14"
          # the default build now runs Logback 1.6; this pins the previous minor so that
          # dropping support for it has to be a decision rather than an accident
          - name: "Logback 1.5 (previous)"
            args: "-Dlogback.version=1.5.38"
          - name: "Log4j2 2.20 (floor)"
            args: "-Dlog4j2.version=2.20.0"
          - name: "Spring Boot 3.2"
            args: "-Dspring-boot.version=3.2.12"
          - name: "Spring Boot 3.3"
            args: "-Dspring-boot.version=3.3.13"
          - name: "Spring Boot 3.5"
            args: "-Dspring-boot.version=3.5.6"
          # 3.15 is the previous LTS, and the version the extension shipped against in 1.3.0.
          # Worth a leg of its own: the runtime/deployment contract is a build-time API, and
          # #193 was exactly that contract changing under us between two supported versions.
          - name: "Quarkus 3.15 (floor)"
            args: "-Dquarkus.version=3.15.1"
          - name: "JUnit Platform 1.10 (floor)"
            args: "-pl stacktale-core,stacktale-junit -am -Djunit.platform.version=1.10.0 -Djunit.jupiter.version=5.10.0"
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify ${{ matrix.args }}
