name: zz bypass probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "probe: can the bot push to main?"
          if git push origin HEAD:main; then
            echo "RESULT=BOT_CAN_PUSH" >> "$GITHUB_STEP_SUMMARY"
            echo "BOT_CAN_PUSH"
            git push origin --delete-ref 2>/dev/null || true
          else
            echo "RESULT=BOT_BLOCKED" >> "$GITHUB_STEP_SUMMARY"
            echo "BOT_BLOCKED"
          fi
