version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # collapse routine minor/patch bumps into ONE PR; majors stay
      # individual so a risky bump gets its own scrutiny.
      maven-minor-patch:
        # Quarkus rides alone. Its minors are not routine: 3.15 -> 3.38 arrived inside this
        # group and broke the extension outright, because Quarkus began refusing a runtime
        # @ConfigMapping as a @BuildStep parameter somewhere in between. Grouped, that turns
        # six harmless bumps red and they wait on unrelated work; on its own, the failure is
        # legible and blocks only itself.
        exclude-patterns:
          - "io.quarkus:*"
        update-types:
          - minor
          - patch
    ignore:
      # Spring Boot 4 is a deliberate major migration, not a routine bump — don't nag.
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
  # A second entry, because the first does not cover this. For github-actions,
  # `directory: "/"` means .github/workflows only — a composite action's own
  # action.yml needs the directory it lives in named explicitly. Without this,
  # .github/actions/report pinned actions/upload-artifact@v4 while every workflow
  # had moved to v7, and nothing was ever going to say so.
  - package-ecosystem: github-actions
    directory: "/.github/actions/report"
    schedule:
      interval: weekly
    groups:
      report-action-minor-patch:
        update-types:
          - minor
          - patch
